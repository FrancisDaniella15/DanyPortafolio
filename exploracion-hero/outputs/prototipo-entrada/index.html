<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ec">
  <title>HELLO — Entrada de portafolio UI/UX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f56816'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23' font-family='sans-serif' fill='white'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <header class="review-bar">
    <div class="identity"><span class="mark" aria-hidden="true">h.</span><span>Entrada de portafolio<small>ESTUDIO DE MOVIMIENTO / 01</small></span></div>
    <div class="actions">
      <span id="phase" role="status" aria-live="polite">Preparando</span>
      <button id="replay" type="button" disabled><span aria-hidden="true">↻</span> Repetir entrada</button>
      <button id="export" class="export" type="button" disabled>Guardar video <span aria-hidden="true">↓</span></button>
    </div>
  </header>
  <main>
    <section class="preview" aria-label="Vista previa de la entrada y el hero">
      <canvas id="scene" role="img" aria-label="Cinco teclas HELLO se hunden por turnos. La cámara se acerca a la O, enlaza con la O del teclado y se aleja hasta revelar el escritorio."></canvas>
      <button id="skip" class="skip" type="button">Omitir entrada <span aria-hidden="true">↗</span></button>
      <div class="accessible-copy">
        <p>Diseño UI/UX</p><h1>Diseño experiencias digitales pensando en las personas.</h1>
        <p>Explora mis proyectos y mi proceso de diseño.</p>
      </div>
      <p id="error" class="error" hidden></p>
    </section>
  </main>
  <div class="timeline-review"><label for="timeline">Ver el recorrido</label><input id="timeline" type="range" min="0" max="4700" step="10" value="0" disabled aria-label="Fotograma de la transición"><output id="time-label" for="timeline">0.0 s</output></div>
  <footer><span>HELLO <span class="path" aria-hidden="true">→</span> la O <span class="path" aria-hidden="true">→</span> mi espacio</span><span>Cinco pulsaciones. Un cambio de escala.</span></footer>
  <a id="download" hidden></a>
</body>
</html>
